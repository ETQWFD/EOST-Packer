<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EOST 管理后台</title>
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f7;color:#202124;min-height:100vh}
.box{background:#fff;border:1px solid #dadce0;padding:28px;max-width:520px;margin:60px auto}
h1{font-size:18px;margin-bottom:16px}
h2{font-size:15px;margin:20px 0 10px}
label{display:block;font-size:13px;color:#5f6368;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #dadce0;font-size:14px;background:#fff;color:#202124}
input:focus,textarea:focus{outline:1px solid #1a73e8;border-color:#1a73e8}
button{background:#1a73e8;color:#fff;border:none;padding:10px 20px;cursor:pointer;font-size:14px;margin-top:10px}
button.sec{background:#e8eaed;color:#202124}
button.danger{background:#d93025}
.row{margin:8px 0;font-size:13px;color:#5f6368}
.item{border:1px solid #e8eaed;padding:12px;margin:8px 0;font-size:13px}
.item .btns{margin-top:6px}
.hide{display:none}
.msg{padding:8px;margin:8px 0;font-size:13px;display:none}
.msg.ok{background:#e6f4ea;color:#188038}
.msg.err{background:#fce8e6;color:#d93025}
</style>
</head>
<body>
<div class="box" id="login">
  <h1>管理员登录</h1>
  <div class="msg" id="login_msg"></div>
  <label for="pw">登录密码</label>
  <input type="password" id="pw" placeholder="请输入密码" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button onclick="login()">登录</button>
</div>

<div class="box hide" id="panel">
  <h1>EOST 管理后台</h1>

  <label for="gh_token">GitHub Token（仓库写权限，用于真实发布公告）</label>
  <input type="password" id="gh_token" placeholder="ghp_xxx 或 github_pat_xxx" autocomplete="off">
  <button onclick="saveToken()">保存 Token</button>
  <div class="row">Token 仅保存在本浏览器 localStorage，用于调用 GitHub API 写入公告文件。</div>

  <h2>下载统计（GitHub 官方数据）</h2>
  <div class="row">GitHub 下载总数：<b id="dl">-</b></div>
  <button class="sec" onclick="loadDl()">刷新</button>

  <h2>发布新公告</h2>
  <label for="t">标题</label>
  <input id="t" placeholder="公告标题" autocomplete="off">
  <label for="v">版本号</label>
  <input id="v" placeholder="如 1.3.0" autocomplete="off">
  <label for="b">内容</label>
  <textarea id="b" rows="4" placeholder="公告内容"></textarea>
  <button onclick="addAnn()">发布到官网</button>
  <div class="msg" id="ann_msg"></div>

  <h2>公告列表（来自官网）</h2>
  <div id="list"></div>

  <button class="sec" onclick="logout()">退出</button>
</div>

<script>
var REPO='ETQWFD/EOST-Packer';
var FILE='api/announcements.json';
var RAW='https://raw.githubusercontent.com/'+REPO+'/main/'+FILE;
var API='https://api.github.com/repos/'+REPO+'/contents/'+FILE;

function showMsg(id,txt,ok){var m=document.getElementById(id);m.textContent=txt;m.style.display='block';m.className='msg '+(ok?'ok':'err');}
function getToken(){return document.getElementById('gh_token').value||localStorage.getItem('gh_token')||'';}

function login(){
  var pw=document.getElementById('pw').value;
  if(pw==='1234'){
    document.getElementById('login').classList.add('hide');
    document.getElementById('panel').classList.remove('hide');
    var saved=localStorage.getItem('gh_token')||'';
    if(saved) document.getElementById('gh_token').value=saved;
    loadDl(); loadAnn();
  }else{showMsg('login_msg','密码错误',false);}
}
function logout(){location.reload();}
function saveToken(){
  var t=document.getElementById('gh_token').value.trim();
  if(!t){showMsg('ann_msg','请输入 Token','err');return;}
  localStorage.setItem('gh_token',t);
  showMsg('ann_msg','Token 已保存（仅本浏览器）','ok');
}
function loadDl(){
  fetch('https://api.github.com/repos/'+REPO+'/releases').then(function(r){return r.json()}).then(function(list){
    var total=0;(list||[]).forEach(function(rel){(rel.assets||[]).forEach(function(a){total+=a.download_count||0})});
    document.getElementById('dl').textContent=total;
  }).catch(function(){document.getElementById('dl').textContent='获取失败'});
}
function loadAnn(){
  fetch(RAW).then(function(r){return r.json()}).then(function(a){
    document.getElementById('list').innerHTML=a.map(function(x,i){
      return '<div class="item"><b>'+x.title+'</b> ('+x.version+')<br>'+x.body+
        '<br><span style="color:#80868b">'+x.date+'</span>'+
        '<div class="btns"><button class="danger" onclick="delAnn('+i+')">删除</button></div></div>';
    }).join('');
  }).catch(function(){document.getElementById('list').innerHTML='<div class="row">读取失败</div>'});
}
function getFileSha(){
  return fetch(API,{headers:{Authorization:'token '+getToken()}})
    .then(function(r){if(!r.ok)throw new Error('读取文件失败 HTTP '+r.status);return r.json()})
    .then(function(j){return {sha:j.sha,content:j.content}});
}
function pushFile(newContent,sha){
  var body={message:'EOST 后台发布公告',content:btoa(unescape(encodeURIComponent(newContent))),sha:sha};
  return fetch(API,{method:'PUT',headers:{Authorization:'token '+getToken(),'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error('写入 GitHub 失败 HTTP '+r.status);return r.json()});
}
function addAnn(){
  var t=document.getElementById('t').value.trim(),v=document.getElementById('v').value.trim(),b=document.getElementById('b').value.trim();
  if(!getToken()){showMsg('ann_msg','请先输入并保存 GitHub Token','err');return;}
  if(!t||!v||!b){showMsg('ann_msg','标题/版本号/内容不能为空','err');return;}
  getFileSha().then(function(f){
    var cur=[];
    try{cur=JSON.parse(atob(f.content));}catch(e){}
    cur.unshift({id:Date.now(),title:t,version:v,body:b,date:new Date().toISOString().slice(0,10)});
    return pushFile(JSON.stringify(cur,null,2),f.sha);
  }).then(function(){showMsg('ann_msg','公告已真实发布到官网','ok');loadAnn();loadDl();})
    .catch(function(e){showMsg('ann_msg',e.message,'err');});
}
function delAnn(i){
  if(!getToken()){showMsg('ann_msg','请先输入并保存 GitHub Token','err');return;}
  getFileSha().then(function(f){
    var cur=JSON.parse(atob(f.content));
    cur.splice(i,1);
    return pushFile(JSON.stringify(cur,null,2),f.sha);
  }).then(function(){showMsg('ann_msg','公告已删除','ok');loadAnn();})
    .catch(function(e){showMsg('ann_msg',e.message,'err');});
}
</script>
</body>
</html>
